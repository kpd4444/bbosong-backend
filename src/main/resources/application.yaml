spring:
  application:
    name: ai-laundry
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
  security:
    oauth2:
      client:
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    groups-order: desc
    operations-sorter: method

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:1800}
  refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}

weather:
  kma:
    service-key: ${KMA_SERVICE_KEY}
    endpoint: https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0

external-api:
  circuit-breaker:
    failure-threshold: 3
    open-duration: 30s
    timeout-thread-limit: 8
  kma:
    connect-timeout: 3s
    read-timeout: 10s
  openai:
    call-timeout: 60s
