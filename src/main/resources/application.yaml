spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ai_laundry?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username:
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        show_sql: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-5-mini}
  security:
    oauth2:
      client:
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - profile
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID:}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:}
  refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:}

app:
  oauth2:
    success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT_URI:}

weather:
  kma:
    service-key: ${KMA_SERVICE_KEY:}

aws:
  region: ${AWS_REGION:}
  s3:
    bucket: ${AWS_S3_BUCKET:}
  cloudfront:
    domain: ${AWS_CLOUDFRONT_DOMAIN:}

clothes:
  analysis:
    concurrency:
      max-active: ${CLOTHES_ANALYSIS_MAX_ACTIVE:5}
      queue-timeout: ${CLOTHES_ANALYSIS_QUEUE_TIMEOUT:60s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ai-laundry
    distribution:
      percentiles-histogram:
        http.server.requests: true
        clothes.analysis.openai: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
        clothes.analysis.openai: 0.5,0.95,0.99
