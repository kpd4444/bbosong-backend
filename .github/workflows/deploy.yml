name: CI/CD Pipeline

# 1. 언제 이 로봇이 움직일지 정합니다.
on:
  push:
    branches: [ "main" ] # main 브랜치에 코드가 push되면 실행됩니다.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # 깃허브가 제공하는 가상 컴퓨터에서 실행합니다.

    steps:
      # 2. 깃허브에 올린 코드를 이 컴퓨터로 가져옵니다.
      - name: 체크아웃
        uses: actions/checkout@v4

      # 3. 자바 프로젝트를 빌드하기 위해 JDK를 설치합니다.
      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 4. Gradle 빌드 명령어를 실행할 권한을 줍니다.
      - name: Gradle 빌드 권한 부여
        run: chmod +x ./gradlew

      # 5. 프로젝트를 빌드해서 .jar 파일을 만듭니다. (테스트는 시간이 걸리니 일단 제외)
      - name: Gradle 빌드
        run: ./gradlew clean bootJar -x test

      # 6. 도커 허브에 로그인합니다. (우리가 등록한 Secrets 사용)
      - name: 도커 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 7. 도커 이미지를 빌드하고 도커 허브에 올립니다(Push).
      - name: 도커 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 도커 아이디/이미지명으로 태그를 답니다.
          tags: ${{ secrets.DOCKER_USERNAME }}/bbosong-server:latest

      # 8. 프로젝트에 있는 docker-compose.yml 파일을 EC2 서버로 복사해 보냅니다.
      - name: EC2로 docker-compose.yml 전송
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/bbosong"

      # 9. 마지막! EC2에 접속해서 새 이미지를 받고 서버를 다시 켭니다.
      - name: EC2 원격 접속 및 배포 실행
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/bbosong
            docker compose pull           # 최신 이미지 다운로드
            docker compose up -d          # 컨테이너 재시작
            docker image prune -f         # 쓰지 않는 옛날 이미지 삭제 (용량 관리)