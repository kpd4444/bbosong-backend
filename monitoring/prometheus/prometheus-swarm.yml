global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "bbosong-logic"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "bbosong_logic:8080"

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
